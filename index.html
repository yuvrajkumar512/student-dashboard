<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <button id="toggleSidebar">☰</button>
    <h1>Student Dashboard</h1>
  </header>

  <aside id="sidebar">
    <nav>
      <ul class="sidebar-nav">
        <li><a href="#expenses">Expenses</a></li>
        <li><a href="#notes">Notes</a></li>
        <li><a href="#cgpa">CGPA</a></li>
        <li><a href="#attendance">Attendance</a></li>
      </ul>
    </nav>
  </aside>

  <main id="main-content">
    <section id="expenses" class="section active">
      <h2>Expenses</h2>
      <table id="expenseTable"></table>
      <button class="add-button" data-type="expense">Add Expense</button>
    </section>

    <section id="notes" class="section">
      <h2>Notes</h2>
      <table id="noteTable"></table>
      <button class="add-button" data-type="note">Add Note</button>
    </section>

    <section id="cgpa" class="section">
      <h2>CGPA</h2>
      <table id="cgpaTable"></table>
    </section>

    <section id="attendance" class="section">
      <h2>Attendance</h2>
      <table id="attendanceTable"></table>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <form id="modalForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required />
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" name="content" required></textarea>
        </div>
        <button type="submit">Add</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
